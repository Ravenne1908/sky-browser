<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Sky Browser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="titlebar">
    <div id="brand">
      <svg viewBox="0 0 512 512" width="20" height="20" aria-hidden="true">
        <path d="M96 352 C 168 240, 240 228, 300 264 C 356 296, 408 288, 420 232"
              fill="none" stroke="#ffffff" stroke-width="42" stroke-linecap="round"/>
      </svg>
      <span>Sky Browser</span><em class="proto">prototype</em>
    </div>
    <nav id="tabs" role="tablist"></nav>
    <button id="newtab" title="Nouvel onglet (Ctrl+T)">+</button>
  </header>

  <div id="toolbar">
    <button id="back" title="Précédent">←</button>
    <button id="fwd" title="Suivant">→</button>
    <button id="reload" title="Recharger">⟳</button>
    <button id="home" title="Page d'accueil">⌂</button>
    <input id="url" type="text" spellcheck="false"
           placeholder="Rechercher ou saisir une adresse">
  </div>

  <main id="views"></main>

  <script src="renderer.js"></script>
</body>
</html>
